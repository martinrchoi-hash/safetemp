<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd6"/>
      <stop offset="1" stop-color="#7cbcf2"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a04d"/>
      <stop offset="1" stop-color="#e2702f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset=".45" stop-color="#fff3c4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sky)"/>
  <!-- a warm sun peeking from the top right -->
  <circle cx="412" cy="100" r="104" fill="url(#glow)"/>
  <circle cx="412" cy="100" r="54" fill="#ffd56b"/>
  <!-- thermometer: white tube with warm mercury -->
  <rect x="210" y="88" width="92" height="262" rx="46" fill="#fff"/>
  <circle cx="256" cy="362" r="82" fill="#fff"/>
  <rect x="236" y="170" width="40" height="190" rx="20" fill="url(#heat)"/>
  <circle cx="256" cy="362" r="52" fill="url(#heat)"/>
  <!-- tick marks -->
  <g stroke="#9fc4ea" stroke-width="10" stroke-linecap="round">
    <path d="M318 140h28M318 190h20M318 240h28M318 290h20"/>
  </g>
</svg>
